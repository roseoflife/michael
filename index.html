layout: home

<section id="about">
  <div class="container hero">
    <div class="avatar">
      <img class="img-circle" src="{{ site.baseurl }}static/img/{{ site.avatar }}" alt="{{ site.author }}">
    </div>

    <h1>Hi, I'm {{ site.author }}!</h1>

    <div class="fact-chips">
      <span class="fact-chip">&#127874; {{ site.age }} years old</span>
      <span class="fact-chip">&#127918; Games</span>
      <span class="fact-chip">&#128218; Reading</span>
      <span class="fact-chip">&#127946; Swimming</span>
      <span class="fact-chip">&#128221; Comics</span>
    </div>

    <div class="cta-row">
      <a class="cta-button" href="{{ site.baseurl }}comics.html">&#128218; My Comics</a>
      <a class="cta-button" href="{{ site.baseurl }}videos.html">&#9654;&#65039; My Videos</a>
    </div>
  </div>
</section>
